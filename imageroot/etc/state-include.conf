# Settings (Telegram credentials, Heisenbridge owner and tokens)
state/bridge.json
# Bridge configuration with its appservice tokens and encryption keys, and
# its registration
state/data/config.yaml
state/data/registration.yaml
# module-dump-state writes a consistent copy of the SQLite database here
state/data/bridge-backup.db
